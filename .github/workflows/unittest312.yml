name: Test original corpus against versions
# This is currently expected to have 6 failures for Python 3.12+ because of a change to unfolding in as_bytes()

on: [push,workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest
    # continue-on-error: true # want to test all versions
    strategy:
      max-parallel: 1
      matrix:
        python-version: [3.8, 3.12, 3.13]

    steps:
    - uses: actions/checkout@master
      with:
        persist-credentials: false
    - uses: actions/checkout@master
      with:
        persist-credentials: false
        repository: apache/incubator-ponymail
        path: ponymail
    - uses: actions/checkout@master
      with:
        persist-credentials: false
        repository: apache/incubator-ponymail-foal
        path: ponymail-foal
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip list
    - name: Foal init
      if: always()
      run: |
        cd ponymail-foal
        sed -e 's/# cropout:/cropout:/' tools/ponymail.yaml.example >tools/ponymail.yaml
    - name: Foal Test main
      if: always()
      run: |
        python runall.py --root ponymail-foal --yamldir yamlorig
